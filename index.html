<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriPlan | Meals</title>
    <link rel="icon" href="./src/images/favicon.png" />
    <link rel="stylesheet" href="./src/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html"><span>✦</span>NutriPlan</a>
      <nav>
        <a class="active" href="index.html">Meals</a>
        <a href="product-scanner.html">Product Scanner</a>
        <a href="food-log.html">Food Log</a>
      </nav>
    </header>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Nourish your day</p>
        <h1>Meals &amp; Recipes</h1>
        <p>Discover delicious meals and keep your nutrition on track.</p>
      </section>
      <section class="toolbar">
        <label class="search"
          ><span>⌕</span
          ><input
            id="search-input"
            type="search"
            placeholder="Search recipes, categories or cuisines" /></label
        ><span id="recipes-count" class="count">Loading meals...</span>
      </section>
      <section class="filters">
        <h2>Categories</h2>
        <div id="categories-grid" class="chips"></div>
      </section>
      <section class="filters">
        <h2>Explore cuisines</h2>
        <div id="area-filter-pills" class="chips"></div>
      </section>
      <section>
        <div id="recipes-grid" class="meal-grid" aria-live="polite"></div>
      </section>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="./src/js/api/mealdb.js"></script>
    <script src="./src/js/pages/meals.js"></script>
  </body>
</html>
