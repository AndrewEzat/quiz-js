<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriPlan | Food Log</title>
    <link rel="icon" href="./src/images/favicon.png" />
    <link rel="stylesheet" href="./bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./src/css/index.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
  </head>
  <body>
    <header
      class="topbar d-flex flex-column position-fixed top-0 start-0 vh-100 border-end"
    >
      <a class="brand d-flex align-items-center gap-2 mb-4" href="index.html">
        <span><i class="bi bi-leaf-fill"></i></span>
        <span class="brand-text d-flex flex-column lh-sm">
          NutriPlan
          <small class="brand-subtitle">Your Wellness Journey</small>
        </span>
      </a>

      <p class="nav-label px-2 mb-2">Main Menu</p>
      <nav class="d-flex flex-column gap-1">
        <a href="index.html"
          ><i class="bi bi-egg-fried"></i><span>Meals &amp; Recipes</span></a
        >
        <a href="product-scanner.html"
          ><i class="bi bi-upc-scan"></i><span>Product Scanner</span></a
        >
        <a class="active" href="food-log.html"
          ><i class="bi bi-clipboard2-pulse"></i><span>Food Log</span></a
        >
      </nav>

      <div class="user-card mt-auto d-flex align-items-center gap-2">
        <img
          src="https://randomuser.me/api/portraits/men/32.jpg"
          alt="Youssef Amir"
          class="user-avatar"
        />
        <div class="flex-grow-1 lh-sm">
          <div class="user-name">Youssef Amir</div>
          <div class="user-plan">Premium Member</div>
        </div>
        <i class="bi bi-chevron-down text-muted"></i>
      </div>
    </header>

    <main class="shell container-fluid">
      <section class="hero compact mb-4">
        <p class="eyebrow" id="foodlog-date"></p>
        <h1>Today's food log</h1>
        <p>Monitor your daily nutrition against your targets.</p>
      </section>

      <section id="nutrition-summary" class="summary-grid"></section>

      <section class="log-header d-flex align-items-center justify-content-between">
        <h2>Logged items</h2>
        <button id="clear-foodlog" class="text-button">Clear today</button>
      </section>
      <section id="logged-items-list" class="log-list"></section>

      <section class="quick-actions d-flex flex-wrap gap-3">
        <a href="index.html"><i class="bi bi-plus-lg"></i> Log a meal</a>
        <a href="product-scanner.html"><i class="bi bi-upc-scan"></i> Scan a product</a>
        <button id="custom-entry-btn"><i class="bi bi-plus-lg"></i> Custom entry</button>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="./bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
    <script type="module" src="./src/js/main.js"></script>
    <script type="module" src="./src/js/ui/components.js"></script>
  </body>
</html>
